<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="inspBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="50%" stop-color="#141920" />
      <stop offset="100%" stop-color="#1d252f" />
    </linearGradient>
    <radialGradient id="inspGlow" cx="65%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#e1c67d" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#c7a557" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0d10" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9413a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e86b35" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="reticleGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(244, 241, 234, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#inspBg)" />
  <rect width="1920" height="1080" fill="url(#reticleGrid)" />
  <circle cx="1300" cy="540" r="500" fill="url(#inspGlow)" />

  <!-- Metrology & Laser Profile Inspection Graphic -->
  <g transform="translate(1320, 540)">
    <!-- Concentric Calibration Rings -->
    <circle r="420" fill="none" stroke="#c7a557" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
    <circle r="340" fill="none" stroke="#e1c67d" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle r="250" fill="none" stroke="rgba(244,241,234,0.2)" stroke-width="2"/>
    <circle r="140" fill="#111418" stroke="#c7a557" stroke-width="3"/>

    <!-- High-Precision Helical & Spur Gear Teeth Silhouette -->
    <g fill="#181e24" stroke="#e1c67d" stroke-width="2.5">
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(22.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(45)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(67.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(90)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(112.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(135)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(157.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(180)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(202.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(225)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(247.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(270)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(292.5)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(315)"/>
      <path d="M -35 -340 L 0 -380 L 35 -340 L 25 -250 L -25 -250 Z" transform="rotate(337.5)"/>
    </g>

    <!-- Scanning Laser Optical Beam -->
    <line x1="-500" y1="-80" x2="500" y2="-80" stroke="url(#laserBeam)" stroke-width="3"/>
    <circle cx="0" cy="-80" r="8" fill="#d9413a"/>

    <!-- Optical Profile Digital Readout Badges -->
    <g transform="translate(-300, -220)" font-family="'DM Mono', monospace" font-size="13" fill="#e1c67d">
      <rect x="-12" y="-20" width="230" height="32" rx="4" fill="#0b0d10" stroke="#c7a557" stroke-width="1.5"/>
      <text x="0" y="2">TOOTH PROFILE ERROR: 0.001mm</text>
    </g>

    <g transform="translate(140, 180)" font-family="'DM Mono', monospace" font-size="13" fill="#95d6d5">
      <rect x="-12" y="-20" width="220" height="32" rx="4" fill="#0b0d10" stroke="#95d6d5" stroke-width="1.5"/>
      <text x="0" y="2">LEAD CHECK: ZERO DEVIATION</text>
    </g>
  </g>

  <!-- Dark Left Vignette for Text Contrast -->
  <rect width="1100" height="1080" fill="url(#inspBg)" opacity="0.85"/>
</svg>
