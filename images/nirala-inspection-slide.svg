<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0e"/>
      <stop offset="40%" stop-color="#11151a"/>
      <stop offset="100%" stop-color="#1a2128"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7a557" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#e1c67d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#11151a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laserGlow" cx="72%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#d9413a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d9413a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftDarken" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c0e" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#0a0c0e" stop-opacity="0.88"/>
      <stop offset="75%" stop-color="#0a0c0e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0c0e" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(244, 241, 234, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Golden & Laser Glow Highlights -->
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>
  <circle cx="1380" cy="480" r="400" fill="url(#laserGlow)"/>

  <!-- Gear Tooth Flank Profile Inspection Graphic -->
  <g transform="translate(1380, 520)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Metrology Circle -->
    <circle r="360" fill="none" stroke="#c7a557" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.5"/>
    <circle r="320" fill="none" stroke="#e1c67d" stroke-width="1" opacity="0.3"/>
    <circle r="220" fill="none" stroke="rgba(244,241,234,0.15)" stroke-width="2"/>
    <circle r="120" fill="#111418" stroke="#c7a557" stroke-width="2.5"/>

    <!-- Gear Teeth Silhouette (High Precision Inspection View) -->
    <g fill="#181d22" stroke="#c7a557" stroke-width="2" opacity="0.85">
      <!-- 12 Concentric Inspection Teeth -->
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(30)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(60)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(90)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(120)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(150)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(180)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(210)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(240)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(270)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(300)"/>
      <path d="M -30 -320 L 0 -360 L 30 -320 L 22 -220 L -22 -220 Z" transform="rotate(330)"/>
    </g>

    <!-- Laser Alignment Crosshairs -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#d9413a" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.7"/>
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#d9413a" stroke-width="1.5" stroke-dasharray="12,6" opacity="0.7"/>

    <!-- Optical Target Reticle Dots -->
    <circle cx="0" cy="-340" r="6" fill="#d9413a"/>
    <circle cx="0" cy="-340" r="14" fill="none" stroke="#d9413a" stroke-width="1.5"/>
    
    <circle cx="294" cy="-170" r="6" fill="#c7a557"/>
    <circle cx="294" cy="-170" r="14" fill="none" stroke="#c7a557" stroke-width="1.5"/>

    <!-- Inspection Measurement Tags -->
    <g transform="translate(180, -260)" font-family="'DM Mono', monospace" font-size="12" fill="#e1c67d">
      <rect x="-10" y="-18" width="160" height="28" rx="4" fill="#111418" stroke="#c7a557" stroke-width="1"/>
      <text x="0" y="0">FLANK TOL: 0.002mm</text>
    </g>

    <g transform="translate(-320, 180)" font-family="'DM Mono', monospace" font-size="12" fill="#95d6d5">
      <rect x="-10" y="-18" width="170" height="28" rx="4" fill="#111418" stroke="#95d6d5" stroke-width="1"/>
      <text x="0" y="0">LEAD ERROR: ZERO</text>
    </g>
  </g>

  <!-- Dark Left Vignette Overlay for Text Readability -->
  <rect width="1920" height="1080" fill="url(#leftDarken)"/>
</svg>
