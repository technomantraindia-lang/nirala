<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="v2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0c" />
      <stop offset="40%" stop-color="#12161c" />
      <stop offset="100%" stop-color="#1b222a" />
    </linearGradient>
    <radialGradient id="v2GoldGlow" cx="68%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#e1c67d" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#c7a557" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080a0c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="v2LaserSpot" cx="72%" cy="40%" r="20%">
      <stop offset="0%" stop-color="#d9413a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d9413a" stop-opacity="0" />
    </radialGradient>
    <pattern id="v2Grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(244, 241, 234, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#v2Bg)" />
  <rect width="1920" height="1080" fill="url(#v2Grid)" />
  <circle cx="1320" cy="540" r="550" fill="url(#v2GoldGlow)" />
  <circle cx="1380" cy="420" r="300" fill="url(#v2LaserSpot)" />

  <!-- Metrology CMM & Optical Laser Reticle Graphic -->
  <g transform="translate(1320, 540)">
    <!-- Outer Metrology Dial Ring -->
    <circle r="440" fill="none" stroke="#c7a557" stroke-width="2" stroke-dasharray="12 8" opacity="0.5"/>
    <circle r="360" fill="none" stroke="#e1c67d" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
    <circle r="260" fill="none" stroke="rgba(244,241,234,0.2)" stroke-width="2"/>
    <circle r="140" fill="#0e1114" stroke="#c7a557" stroke-width="3"/>

    <!-- 16 Tooth Flank Precision Gear Silhouette -->
    <g fill="#161b22" stroke="#e1c67d" stroke-width="2">
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(22.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(45)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(67.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(90)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(112.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(135)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(157.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(180)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(202.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(225)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(247.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(270)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(292.5)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(315)"/>
      <path d="M -30 -360 L 0 -400 L 30 -360 L 22 -260 L -22 -260 Z" transform="rotate(337.5)"/>
    </g>

    <!-- Crosshairs & Optical Measurement Guides -->
    <line x1="-520" y1="0" x2="520" y2="0" stroke="#d9413a" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.75"/>
    <line x1="0" y1="-520" x2="0" y2="520" stroke="#d9413a" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.75"/>

    <circle cx="0" cy="-380" r="8" fill="#d9413a"/>
    <circle cx="0" cy="-380" r="18" fill="none" stroke="#d9413a" stroke-width="1.5"/>

    <circle cx="351" cy="-145" r="7" fill="#c7a557"/>
    <circle cx="351" cy="-145" r="16" fill="none" stroke="#c7a557" stroke-width="1.5"/>

    <!-- High-Tech Measurement Badges -->
    <g transform="translate(180, -280)" font-family="'DM Mono', monospace" font-size="12" fill="#e1c67d">
      <rect x="-10" y="-18" width="220" height="30" rx="4" fill="#080a0c" stroke="#c7a557" stroke-width="1.5"/>
      <text x="0" y="2">TOOTH FLANK: ±0.001mm</text>
    </g>

    <g transform="translate(-380, 200)" font-family="'DM Mono', monospace" font-size="12" fill="#95d6d5">
      <rect x="-10" y="-18" width="230" height="30" rx="4" fill="#080a0c" stroke="#95d6d5" stroke-width="1.5"/>
      <text x="0" y="2">PITCH ERROR: ZERO DEVIATION</text>
    </g>
  </g>

  <!-- Dark Left Vignette for Text Legibility -->
  <rect width="1100" height="1080" fill="url(#v2Bg)" opacity="0.9"/>
</svg>
